services:
  ipam:
    image: ${DOCKER_MIRROR:-}docker.io/nginxinc/nginx-unprivileged:alpine
    container_name: ipam
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:8080"
    volumes:
      - "${TRIM_APPDEST}/www:/usr/share/nginx/html:ro"
      - "${TRIM_APPDEST}/docker/default.conf:/etc/nginx/conf.d/default.conf:ro"
    environment:
      - TZ=Asia/Shanghai
